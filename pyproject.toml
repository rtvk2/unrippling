[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "unripple"
version = "0.1.0"
description = "Classical restoration of scenes seen through wavy water (DIP project)"
requires-python = ">=3.10"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["stage_*", "utils", "comparison", "data"]
namespaces = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.package-data]
data = ["manifest.json"]
